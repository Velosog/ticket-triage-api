name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (lint, format, typecheck, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint, type-aware)
        run: pnpm lint

      - name: Format (Prettier)
        run: pnpm format:check

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Audit dependencies for known vulnerabilities
        run: pnpm audit --prod --audit-level high

  test:
    name: test (vitest + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ticket_triage_test
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage -d ticket_triage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://triage:triage-ci@localhost:5432/ticket_triage_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # No test calls a paid API: LLM_PROVIDER is "fake" in vitest.config.ts
      # and no ANTHROPIC_API_KEY exists in this workflow.
      - name: Run tests (migrations are applied by the global setup)
        run: pnpm test

  secrets-scan:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with the rev in .pre-commit-config.yaml
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f "$tarball" checksums.txt gitleaks

      - name: Scan full git history
        run: gitleaks git --verbose --redact

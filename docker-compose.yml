# Local PostgreSQL for development and tests. The API itself runs on the host
# with `pnpm dev` (see README.md).
name: ticket-triage

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ticket_triage
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # 5433 on the host, so it can run next to another local PostgreSQL.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U triage -d ticket_triage']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
